# Screen-scrape patterns for Claude Code
#
# Each [[rule]] matches against the last N lines of the pane's visible content.
# Rules are evaluated in order; the first match wins.
#
# Fields:
#   state    — the state to assign: "waiting" or "idle"
#   pattern  — regex to search for in the captured text
#   exclude  — optional regex; if this also matches, the rule is skipped

[[rule]]
state = "waiting"
pattern = '''requires approval|\(f\) Approve all pending|Yes, single permission|Trust, always allow|No \(Tab to edit\)|Allow once|Allow always|Do you want to proceed\?|shift\+tab to approve'''

[[rule]]
state = "waiting"
pattern = '''Enter to select .* Esc to cancel|Esc to cancel .* Tab to amend'''

[[rule]]
state = "idle"
pattern = '''ask a question or describe a task'''

# Idle: the mode footer (shift+tab to cycle / ? for shortcuts) is visible, but
# only if the agent isn't actively working. CC signals "working" with a running
# spinner and an elapsed timer in parens — "✽ Working… (3s)", "(57s · ↓ 432
# tokens)", "(5m 7s · …)" — or the older "esc to interrupt" hint. The parenthesised
# elapsed timer (\(\d+[ms]) is the reliable marker: it's present for the whole
# turn regardless of spinner verb or whether a token counter has appeared yet,
# and never shows when idle.
#
# The third alternative vetoes on a running *background* agent. The main agent can be
# idle at an empty prompt — footer and all — while a background agent works, listed
# below the footer as "◯ <name>  <task>…    1m 3s · ↓ 132.0k tokens". Without this
# veto the pane classifies as idle, and since poll.py demotes a WORKING pane whenever
# the scrape says idle, it would flip-flop and raise a spurious unseen flag each time.
#
# A running row ends in an elapsed time; a finished one ends in the literal "idle" (or
# nothing). The row persists either way, so that trailing status is the only signal.
# Not keyed to the ◯/⏺ glyph: those mark which entry is focused in the list, not which
# agent is running, and they swap as you move between agents. The "❯ " prefix is
# optional because it's a transient navigation cursor — present only while the user is
# moving between agents, on whichever row is highlighted.
#
# "to select · Enter to view" is the footer of the agent-list view, which replaces the
# usual mode footer while the user browses agents. Without it no idle rule matches
# there, so classify returns None; poll.py reads that as "unknown" and leaves a WORKING
# pane alone, stranding it on WRK after the background agent finished. The exclude
# above still covers the running case, so treating this footer as idle is safe.
[[rule]]
state = "idle"
pattern = '''shift\+tab to cycle|\? for shortcuts|manual mode on|to select · Enter to view'''
exclude = '''esc to interrupt|\(\d+[hms]|^[ \t]*(?:❯[ \t]+)?[◯⏺][ \t]+\S+[ \t]{2,}.*?\b\d+[hms]\b[ \t]*(?:·|$)'''
